# Production-shaped docker-compose. Brings up Postgres, the control plane, and the
# web UI on a shared network. The control plane is the single entry point: it serves
# the UI under /app, the REST API under /api, and the agent mTLS gRPC endpoint. The
# web container stays internal and is reached through the control plane.
# Override defaults by exporting env vars or copying the block under x-env into a
# `.env` file.

x-env: &cp-env
  DATABASE_URL: postgres://croncompose:croncompose@postgres:5432/croncompose?sslmode=disable
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"
  TLS_DIR: /home/ccompose/tls
  # TLS_HOSTS must include the public hostname agents dial (the control plane's host),
  # since agents terminate mTLS against the control plane directly.
  TLS_HOSTS: ${TLS_HOSTS:-localhost,control-plane}
  SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
  # 32-byte hex (openssl rand -hex 32). Wraps stored secrets; back it up offline.
  SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:?set SECRETS_MASTER_KEY in .env}
  SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set SEED_ADMIN_EMAIL in .env}
  SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
  # Internal Next.js UI address the control plane reverse-proxies /app to.
  WEB_UPSTREAM: http://web:3000
  # Addresses advertised to agents at enrollment. Point them at the control plane's
  # published HTTP and gRPC ports. Defaults assume local plain-mode.
  PUBLIC_HTTP_URL: ${PUBLIC_HTTP_URL:-http://localhost:8080/api/v1}
  PUBLIC_GRPC_ADDR: ${PUBLIC_GRPC_ADDR:-localhost:9090}
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: croncompose
      POSTGRES_PASSWORD: croncompose
      POSTGRES_DB: croncompose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U croncompose"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single entry point. Publishes the HTTP port (UI at /app, REST at /api) and the
  # agent mTLS gRPC port. Reverse-proxies /app to the internal web container.
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    environment:
      <<: *cp-env
    volumes:
      - cp-tls:/home/ccompose/tls
    ports:
      - "${PUBLIC_PORT:-8080}:8080"       # HTTP: UI (/app) + REST (/api)
      - "${PUBLIC_GRPC_PORT:-9090}:9090"  # mTLS gRPC for agents
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      API_BASE: http://control-plane:8080/api/v1
      PORT: 3000
    # Internal only — reached via the control plane's /app reverse proxy.
    expose:
      - "3000"
    depends_on:
      - control-plane

volumes:
  pgdata:
  cp-tls:
