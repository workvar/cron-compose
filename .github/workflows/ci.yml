name: CI

# Minutes-conscious CI. Pull requests get one cheap Go job plus the codegen guard.
# The expensive checks (Postgres integration, web typecheck) run only on main, and
# doc-only changes skip the workflow entirely.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"

# A second push to the same branch cancels the first run instead of paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # Guards the two things that break a clean clone but not a dirty dev machine:
  # generated protobuf code drifting behind agent.proto, and go.sum missing an entry
  # for a newly imported module.
  codegen:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"
      - name: proto/agent/v1 matches agent.proto
        run: make proto-check
      - name: go.sum is complete
        run: |
          for m in proto control-plane agent cli; do
            (cd "$m" && go mod download all) || { echo "$m: run go mod tidy"; exit 1; }
          done

  # One runner for all four modules. The matrix that used to fan this out cost 4x
  # the minutes for the same signal, and -race roughly doubled the test time again.
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: vet, test, build
        run: |
          set -euo pipefail
          for m in proto control-plane agent cli; do
            echo "::group::$m"
            (cd "$m" && go vet ./... && go test -count=1 ./... && go build ./...)
            echo "::endgroup::"
          done

  # Costs a Postgres service container, so it is worth it on main only. A PR that
  # touches the REST surface can be checked locally with:
  #   cd control-plane && go test -tags integration ./internal/api -run TestRESTRoundTrip
  integration:
    name: Control plane integration
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: croncompose
          POSTGRES_PASSWORD: croncompose
          POSTGRES_DB: croncompose_it
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U croncompose"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: control-plane/go.sum
      - name: integration test
        working-directory: control-plane
        env:
          INTEGRATION_DB_URL: postgres://croncompose:croncompose@localhost:5432/croncompose_it?sslmode=disable
        run: go test -tags integration ./internal/api -run TestRESTRoundTrip

  # npm install + tsc is the slowest job here and the one a dev is most likely to
  # have already run locally, so it stays on main.
  web:
    name: Web typecheck
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        # No lockfile yet, so install without ci. CI runs after the first dev run.
        run: npm install --no-audit --no-fund

      - name: typecheck
        working-directory: web
        run: npx tsc --noEmit
