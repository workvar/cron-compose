name: Release

# Notes-only GitHub release: publish RELEASE_NOTES.md and a tag-baked install-agent
# script. No Go/Node matrix builds — hosts clone the tag and build locally.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bake install scripts for this tag
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p out
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__REPO__|${REPO}|g" \
              scripts/install-agent.sh > out/install-agent.sh
          chmod 0755 out/install-agent.sh
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__REPO__|${REPO}|g" \
              scripts/install-agent.ps1 > out/install-agent.ps1
          # Sanity: placeholders must be gone from the published shell installer.
          ! grep -q '__VERSION__\|__REPO__' out/install-agent.sh
          head -n 40 out/install-agent.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/install-agent.sh
            out/install-agent.ps1
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
